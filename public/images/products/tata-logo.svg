<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
        
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5f7fa" />
        <stop offset="25%" stop-color="#c3cfe2" />
        <stop offset="50%" stop-color="#e2e8f0" />
        <stop offset="75%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe259" />
        <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
</defs>

        <rect width="300" height="240" rx="12" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>
        <rect x="20" y="20" width="260" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="150" cy="95" r="55" fill="none" stroke="url(#chromeGrad)" stroke-width="8" filter="url(#shadow)"/>
        <text x="150" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" fill="url(#chromeGrad)" text-anchor="middle" letter-spacing="2" filter="url(#shadow)">TATA</text>
        <rect x="100" y="152" width="100" height="6" rx="3" fill="#cbd5e1"/>
        <text x="150" y="195" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Tata Logo</text>
        <text x="150" y="215" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Original Chrome Grille Emblem</text>
    </svg>