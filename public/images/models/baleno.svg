<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60">
        
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5f7fa" />
        <stop offset="25%" stop-color="#c3cfe2" />
        <stop offset="50%" stop-color="#e2e8f0" />
        <stop offset="75%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe259" />
        <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
</defs>

        <rect width="160" height="60" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
        <text x="80" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" font-style="italic" fill="url(#chromeGrad)" text-anchor="middle" letter-spacing="3" filter="url(#shadow)">BALENO</text>
    </svg>