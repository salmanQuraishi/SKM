<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="25%" stop-color="#cbd5e1" />
        <stop offset="50%" stop-color="#f8fafc" />
        <stop offset="75%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#d90429" />
        <stop offset="100%" stop-color="#ef233c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
</defs>

    <rect width="800" height="450" fill="#090d16"/>
    
    <!-- Ambient Red Underglow -->
    <ellipse cx="400" cy="270" rx="260" ry="80" fill="rgba(217, 4, 41, 0.15)" filter="url(#glow)"/>

    <!-- Premium Carbon Monogram Plinth -->
    <rect x="140" y="160" width="520" height="130" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
    <rect x="150" y="170" width="500" height="110" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>

    <!-- 3D Chrome Automotive Monogram Badge: CRETA / SCORPIO style bold lettering -->
    <g filter="url(#shadow)">
        <text x="400" y="242" font-family="'Montserrat', sans-serif" font-size="46" font-weight="900" font-style="italic" fill="url(#chromeGrad)" text-anchor="middle" letter-spacing="14">MONOGRAMS</text>
    </g>

    <!-- Chrome Badge Accent Line -->
    <line x1="220" y1="260" x2="580" y2="260" stroke="url(#redGrad)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Mini Chrome Subtitle Badge -->
    <rect x="330" y="320" width="140" height="26" rx="13" fill="#161f30" stroke="#334155" stroke-width="1"/>
    <text x="400" y="338" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">3D EMBOSSED</text>
</svg>
