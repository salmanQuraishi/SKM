<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
        
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5f7fa" />
        <stop offset="25%" stop-color="#c3cfe2" />
        <stop offset="50%" stop-color="#e2e8f0" />
        <stop offset="75%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe259" />
        <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
</defs>

        <circle cx="50" cy="30" r="25" fill="#111827" stroke="url(#chromeGrad)" stroke-width="3" filter="url(#shadow)"/>
        <path d="M50,12 A18,18 0 0,1 68,30 L50,30 Z" fill="#38bdf8"/>
        <path d="M50,30 L32,30 A18,18 0 0,1 50,12 Z" fill="#ffffff"/>
        <path d="M50,30 L50,48 A18,18 0 0,1 32,30 Z" fill="#38bdf8"/>
        <path d="M50,30 L68,30 A18,18 0 0,1 50,48 Z" fill="#ffffff"/>
        <circle cx="50" cy="30" r="18" fill="none" stroke="url(#chromeGrad)" stroke-width="2"/>
    </svg>