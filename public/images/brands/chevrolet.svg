</defs>
    <!-- Chevrolet Bowtie -->
    <path d="M15,24 L85,24 L82,36 L18,36 Z" fill="url(#goldGrad)" stroke="url(#chromeGrad)" stroke-width="2.5" filter="url(#shadow)"/>
