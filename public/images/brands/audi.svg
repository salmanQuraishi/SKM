<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="30%" stop-color="#e2e8f0" />
        <stop offset="70%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
</defs>
    <!-- Audi 4 Interlocking Rings -->
    <circle cx="26" cy="30" r="14" fill="none" stroke="url(#chromeGrad)" stroke-width="2.8" filter="url(#shadow)"/>
    <circle cx="42" cy="30" r="14" fill="none" stroke="url(#chromeGrad)" stroke-width="2.8" filter="url(#shadow)"/>
    <circle cx="58" cy="30" r="14" fill="none" stroke="url(#chromeGrad)" stroke-width="2.8" filter="url(#shadow)"/>
    <circle cx="74" cy="30" r="14" fill="none" stroke="url(#chromeGrad)" stroke-width="2.8" filter="url(#shadow)"/>
</svg>
