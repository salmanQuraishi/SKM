<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
        
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5f7fa" />
        <stop offset="25%" stop-color="#c3cfe2" />
        <stop offset="50%" stop-color="#e2e8f0" />
        <stop offset="75%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe259" />
        <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
</defs>

        <circle cx="50" cy="30" rx="24" ry="24" fill="none" stroke="url(#chromeGrad)" stroke-width="4.5" filter="url(#shadow)"/>
        <path d="M34,20 L44,42 L50,28 L56,42 L66,20 M38,20 L50,38 L62,20" fill="none" stroke="url(#chromeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
    </svg>