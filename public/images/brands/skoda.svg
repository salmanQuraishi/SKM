<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="30%" stop-color="#e2e8f0" />
        <stop offset="60%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="skodaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80" />
        <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
</defs>
    <!-- Skoda Winged Arrow Emblem -->
    <circle cx="50" cy="30" r="24" fill="none" stroke="url(#chromeGrad)" stroke-width="3.5" filter="url(#shadow)"/>
    <circle cx="50" cy="30" r="19" fill="#0f172a" />
    <!-- Winged Arrow Silhouette -->
    <path d="M42,34 L58,22 L55,27 L65,24 L48,38 L45,34 Z" fill="url(#skodaGreen)" filter="url(#shadow)"/>
    <circle cx="43" cy="27" r="2.5" fill="url(#chromeGrad)"/>
</svg>
