<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="25%" stop-color="#cbd5e1" />
        <stop offset="50%" stop-color="#f8fafc" />
        <stop offset="75%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
</defs>

    <rect width="800" height="450" fill="#090d16"/>

    <!-- SUV Rear Silhouette -->
    <path d="M100,390 L700,390 Q770,380 780,330 L765,220 Q750,140 600,105 L510,85 Q400,75 290,85 L200,105 Q50,140 35,220 L20,330 Q30,380 100,390 Z" fill="#0d131f" stroke="#1e293b" stroke-width="4"/>
    
    <!-- Rear Windshield & Roof Spoiler -->
    <path d="M180,120 L620,120 L570,210 L230,210 Z" fill="#05080f" stroke="#334155" stroke-width="2"/>
    <path d="M170,110 L630,110 L610,125 L190,125 Z" fill="#1e293b"/>

    <!-- Connected LED Tail Light Bar -->
    <path d="M70,230 L730,230 L725,245 L75,245 Z" fill="#ef4444" filter="url(#redGlow)"/>

    <!-- Centered Brand Logo Badge Oval -->
    <ellipse cx="400" cy="275" rx="36" ry="20" fill="#111827" stroke="url(#chromeGrad)" stroke-width="5" filter="url(#shadow)"/>
    <!-- Stylized T / Wings in Logo -->
    <path d="M380,265 Q400,285 400,292 Q400,285 420,265" fill="none" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M374,272 Q400,266 426,272" fill="none" stroke="url(#chromeGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Model Lettering THAR / SAFARI Style -->
    <text x="400" y="340" font-family="'Montserrat', sans-serif" font-size="22" font-weight="900" fill="url(#chromeGrad)" text-anchor="middle" letter-spacing="8" filter="url(#shadow)">ORIGINAL EMBLEMS</text>
    
    <!-- 4x4 / AWD Badge -->
    <rect x="610" y="315" width="60" height="20" rx="4" fill="#090d16" stroke="#d90429" stroke-width="1.5"/>
    <text x="640" y="329" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#ef4444" text-anchor="middle">4 × 4</text>
</svg>
