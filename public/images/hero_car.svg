<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
    
<defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5f7fa" />
        <stop offset="25%" stop-color="#c3cfe2" />
        <stop offset="50%" stop-color="#e2e8f0" />
        <stop offset="75%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe259" />
        <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
</defs>

    <rect width="800" height="450" fill="#090d16"/>
    <!-- Car body silhouette (rear view of dark premium sedan) -->
    <path d="M120,380 L680,380 Q760,370 780,320 L760,250 Q740,180 620,150 L520,110 Q400,90 280,110 L180,150 Q60,180 40,250 L20,320 Q40,370 120,380 Z" fill="#0d131f" stroke="#1e293b" stroke-width="4"/>
    <!-- Rear windshield -->
    <path d="M210,150 L590,150 L530,220 L270,220 Z" fill="#05080f" stroke="#334155" stroke-width="2"/>
    <!-- LED Tail lights Glowing Red -->
    <path d="M80,240 Q180,250 280,240 L270,265 Q180,270 90,260 Z" fill="#ef4444" filter="url(#glow)"/>
    <path d="M720,240 Q620,250 520,240 L530,265 Q620,270 710,260 Z" fill="#ef4444" filter="url(#glow)"/>
    <!-- Chrome Trunk Emblem in center -->
    <ellipse cx="400" cy="245" rx="34" ry="18" fill="none" stroke="url(#chromeGrad)" stroke-width="5" filter="url(#shadow)"/>
    <path d="M388,237 Q393,245 391,253 M412,237 Q407,245 409,253 M389,245 Q400,242 411,245" fill="none" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Model Lettering VERNA -->
    <text x="240" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" font-style="italic" fill="url(#chromeGrad)" letter-spacing="4" filter="url(#shadow)">VERNA</text>
    <!-- Trim Badge SX -->
    <text x="600" y="300" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="url(#chromeGrad)" letter-spacing="2">SX</text>
    <!-- Twin Chrome Exhaust Tips -->
    <ellipse cx="640" cy="360" rx="14" ry="10" fill="#111" stroke="url(#chromeGrad)" stroke-width="3"/>
    <ellipse cx="675" cy="360" rx="14" ry="10" fill="#111" stroke="url(#chromeGrad)" stroke-width="3"/>
</svg>